<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="914px" preserveAspectRatio="none" style="width:1034px;height:914px;background:#FBF8EF;" version="1.1" viewBox="0 0 1034 914" width="1034px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FBF8EF" height="914" style="stroke:none;stroke-width:1;" width="1034" x="0" y="0"/><g class="title" data-source-line="6"><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="318.5127" x="357.1582" y="34.9659">Vimium link hints &#8212; f then a label then follow</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="255.471" x="388.6791" y="54.0339">[:ui :hints] = active? + targets + typed</text></g><ellipse cx="305.1209" cy="84.1358" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#C7E8DE" height="36.3441" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="321.4302" x="144.4058" y="114.1358"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="301.4302" x="154.4058" y="136.9639">press f (resolver, Vim normal) then dispatch hint/start</text><rect fill="#E2CAE5" height="69.0323" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="391.0426" x="109.5996" y="170.4799"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="371.0426" x="119.5996" y="193.308">hints/collect &#8212; every visible hintable element in the content pane:</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="321.9863" x="119.5996" y="209.6522">links (a[href]) &#183; file/dir rows ([data-path]) &#183; diff file banners</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="329.6664" x="119.5996" y="225.9963">(.vv-diff-file-head, ADR-0037) &#8212; classify + viewport position</text><rect fill="#E2CAE5" height="52.6882" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="295.9899" x="157.1259" y="259.5123"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="275.9899" x="167.1259" y="282.3404">hints/with-labels &#8212; uniform-length unique labels</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="269.4139" x="167.1259" y="298.6845">from a home-row alphabet (SADFJKLEWCMPGH)</text><rect fill="#C5CFEA" height="36.3441" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="269.7458" x="170.248" y="332.2005"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="249.7458" x="180.248" y="355.0286">ui-hints state becomes active; overlay drawn</text><rect fill="#C7E8DE" height="36.3441" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="272.8178" x="168.712" y="388.5446"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="252.8178" x="178.712" y="411.3727">overlay draws a label badge over each target</text><rect fill="#C5CFEA" height="52.6882" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="289.4739" x="160.3839" y="444.8887"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="200.6054" x="170.3839" y="467.7168">type a label character; typed grows;</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="269.4739" x="170.3839" y="484.061">matches = targets whose label starts-with typed</text><polygon fill="#FFF6D6" points="231.3609,517.577,378.8809,517.577,390.8809,529.577,378.8809,541.577,231.3609,541.577,219.3609,529.577,231.3609,517.577" style="stroke:#7F6B14;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="11" lengthAdjust="spacing" textLength="147.52" x="231.3609" y="533.8449">how many labels still match?</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="11" lengthAdjust="spacing" textLength="45.0447" x="174.3162" y="526.354">exactly 1</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="11" lengthAdjust="spacing" textLength="59.1026" x="390.8809" y="526.354">zero, or Esc</text><rect fill="#EEE6C1" height="69.0323" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="323.5182" x="16" y="551.577"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="243.9618" x="26" y="574.4051">follow &#8212; file to doc/open &#183; http to web view</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="250.1178" x="26" y="590.7492">&#183; dir to open-path &#183; anchor to scroll-into-view</text><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="303.5182" x="26" y="607.0933">&#183; diff banner (toggle) to its own click (collapse/expand)</text><rect fill="#C5CFEA" height="36.3441" rx="4" ry="4" style="stroke:#4C66AE;stroke-width:0.5;" width="145.9289" x="359.5182" y="551.577"/><text fill="#1A1A1A" font-family="'Inter, Helvetica, sans-serif'" font-size="12" lengthAdjust="spacing" textLength="125.9289" x="369.5182" y="574.4051">clear the hints (cancel)</text><polygon fill="#FFF6D6" points="305.1209,626.6093,317.1209,638.6093,305.1209,650.6093,293.1209,638.6093,305.1209,626.6093" style="stroke:#7F6B14;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M336.1209,660.6093 L336.1209,705.8744 L316.1209,709.8744 L336.1209,713.8744 L336.1209,759.1394 A0,0 0 0 0 336.1209,759.1394 L1013.8292,759.1394 A0,0 0 0 0 1013.8292,759.1394 L1013.8292,670.6093 L1003.8292,660.6093 L336.1209,660.6093 A0,0 0 0 0 336.1209,660.6093" fill="#FFF6D6" style="stroke:#7F6B14;stroke-width:0.5;"/><path d="M1003.8292,660.6093 L1003.8292,670.6093 L1013.8292,670.6093 L1003.8292,660.6093" fill="#FFF6D6" style="stroke:#7F6B14;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="656.7083" x="342.1209" y="679.5063">Per-keystroke loop: the type step repeats while two or more labels match &#8212; non-matching badges hide and</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="654.4984" x="342.1209" y="697.2123">filtering continues; Backspace pops a char; the decision above resolves the typing. A capture-phase window</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="625.9372" x="342.1209" y="714.9184">key listener owns the keyboard ONLY while hints are active (pre-empting the global resolver), so f itself</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="637.3385" x="342.1209" y="732.6244">still reaches the resolver to START hinting. PDF pages are excluded (Chromium's plugin viewer cannot be</text><text fill="#000000" font-family="'Inter, Helvetica, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="587.0676" x="342.1209" y="750.3304">script-injected); HTTP pages run their own self-contained f-hint mode injected by web-preload.js.</text><ellipse cx="305.1209" cy="709.8744" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="305.1209" cy="709.8744" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="94.1358" y2="114.1358"/><polygon fill="#555555" points="301.1209,104.1358,305.1209,114.1358,309.1209,104.1358,305.1209,108.1358" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="150.4799" y2="170.4799"/><polygon fill="#555555" points="301.1209,160.4799,305.1209,170.4799,309.1209,160.4799,305.1209,164.4799" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="239.5123" y2="259.5123"/><polygon fill="#555555" points="301.1209,249.5123,305.1209,259.5123,309.1209,249.5123,305.1209,253.5123" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="312.2005" y2="332.2005"/><polygon fill="#555555" points="301.1209,322.2005,305.1209,332.2005,309.1209,322.2005,305.1209,326.2005" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="368.5446" y2="388.5446"/><polygon fill="#555555" points="301.1209,378.5446,305.1209,388.5446,309.1209,378.5446,305.1209,382.5446" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="305.1209" x2="305.1209" y1="424.8887" y2="444.8887"/><polygon fill="#555555" points="301.1209,434.8887,305.1209,444.8887,309.1209,434.8887,305.1209,438.8887" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1.3;" x1="219.3609" x2="177.7591" y1="529.577" y2="529.577"/><line style="stroke:#555555;stroke-width:1.3;" x1="177.7591" x2="177.7591" y1="529.577" y2="551.577"/><polygon fill="#555555" p