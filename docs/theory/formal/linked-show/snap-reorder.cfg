\* snap-reorder — one configuration of check.sh beside it; docs/theory/11 §6 says what each one checks
SPECIFICATION Spec
CONSTANTS
    Presenter = Presenter
    Audience = Audience
    Nil = Nil
    Pages = {0, 1, 2}
    Blanks = {"none", "black"}
    NoBlank = "none"
    MaxUser = 3
    Reorder = TRUE
    SnapPresenter <- SnapHide1Down
    SnapAudience <- SnapLast
    NoHold = FALSE
    NoHeldCheck = FALSE
    NoApplying = FALSE
    NoStaleGuard = FALSE
    NoMidGuard = FALSE
    AnnounceOnMount = FALSE
INVARIANTS TypeOK Convergence NoEcho BoundedCorrections
PROPERTIES SeqMonotone Settles
