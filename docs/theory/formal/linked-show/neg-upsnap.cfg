    Audience = Audience
    Nil = Nil
    Pages = {0, 1, 2}
    Blanks = {"none", "black"}
    NoBlank = "none"
    MaxUser = 1
    Reorder = FALSE
    SnapPresenter <- SnapHide1Up
    SnapAudience <- SnapLast
    NoHold = FALSE
    NoHeldCheck = FALSE
    NoApplying = FALSE
    NoStaleGuard = FALSE
    NoMidGuard = FALSE
    AnnounceOnMount = FALSE
    MaxAway = 0
    StaleRemount = FALSE
    AwayDrop = FALSE
CONSTRAINT SeqBound
INVARIANTS TypeOK BoundedCorrections
